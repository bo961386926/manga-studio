global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@manga-studio.local'
  smtp_auth_username: 'alerts@manga-studio.local'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    email_configs:
      - to: 'ops@manga-studio.local'
        send_resolved: true
    # webhook for Slack/DingTalk/etc
    webhook_configs:
      - url: 'http://host.docker.internal:5000/webhook/alerts'
        send_resolved: true

  - name: 'critical'
    email_configs:
      - to: 'oncall@manga-studio.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://host.docker.internal:5000/webhook/alerts-critical'
        send_resolved: true

  - name: 'warning'
    email_configs:
      - to: 'team@manga-studio.local'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']