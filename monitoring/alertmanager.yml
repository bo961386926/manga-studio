global:
  resolve_timeout: 5m
  smtp_smarthost: '${ALERTMANAGER_SMTP_HOST:-smtp.gmail.com:587}'
  smtp_from: '${ALERTMANAGER_SMTP_FROM:-alerts@manga-studio.local}'
  smtp_auth_username: '${ALERTMANAGER_SMTP_USER:-alerts@manga-studio.local}'
  smtp_auth_password: '${ALERTMANAGER_SMTP_PASSWORD}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    email_configs:
      - to: '${ALERTMANAGER_DEFAULT_EMAIL:-ops@manga-studio.local}'
        send_resolved: true
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_DEFAULT:-http://host.docker.internal:5000/webhook/alerts}'
        send_resolved: true

  - name: 'critical'
    email_configs:
      - to: '${ALERTMANAGER_CRITICAL_EMAIL:-oncall@manga-studio.local}'
        send_resolved: true
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_CRITICAL:-http://host.docker.internal:5000/webhook/alerts-critical}'
        send_resolved: true

  - name: 'warning'
    email_configs:
      - to: '${ALERTMANAGER_WARNING_EMAIL:-team@manga-studio.local}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']