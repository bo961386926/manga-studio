global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'manga-studio'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Manga Studio API metrics
  - job_name: 'manga-studio-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['manga-studio-api:3001']
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter (if added later)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    # Only scrape if node-exporter is running
    # relabel_configs:
    #   - source_labels: [__address__]
    #     action: drop
    #     regex: 'node-exporter:9100'