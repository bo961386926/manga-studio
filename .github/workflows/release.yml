name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 根目录只有 pnpm-lock.yaml，必须用 pnpm（npm ci 无 lockfile 会失败）
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Package web dist
        run: |
          zip -r manga-studio-web-dist.zip dist/
          echo "artifact=manga-studio-web-dist.zip" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          skip_if_release_exists: true
          files: |
            manga-studio-web-dist.zip
