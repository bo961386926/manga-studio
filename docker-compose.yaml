# 日志轮转：默认 json-file 无限增长会吃满磁盘
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: manga-studio-db
    logging: *default-logging
    environment:
      POSTGRES_DB: manga_studio
      POSTGRES_USER: postgres
      # 强制从 .env 提供，杜绝默认弱口令（docker compose --env-file .env up）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # 不映射宿主机端口：数据库仅内部网络可达。
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manga_studio"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - manga-studio-network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.server
    image: manga-studio-api:latest
    container_name: manga-studio-api
    # API 不暴露宿主公网端口：仅内部网络可达（nginx 反代），
    # 防止未认证的 API 端口暴露到公网（stage-3 硬化）。
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=manga_studio
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # 登录/注册的 CORS + 匿名变更守卫白名单：必须是浏览器实际访问的 HTTPS 源，
      # 否则所有登录请求会被 403 拒绝。
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set in .env}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:?PUBLIC_APP_URL must be set in .env}
      # 生产必需的加密密钥（32 字节 hex）；缺失时服务端 fail-close 拒绝启动。
      - MODEL_ENC_KEY=${MODEL_ENC_KEY:?MODEL_ENC_KEY must be set in .env}
      - REQUEST_HMAC_KEY=${REQUEST_HMAC_KEY:?REQUEST_HMAC_KEY must be set in .env}
      - EMAIL_DELIVERY_KEY=${EMAIL_DELIVERY_KEY:?EMAIL_DELIVERY_KEY must be set in .env}
      - IP_HMAC_SALT=${IP_HMAC_SALT:?IP_HMAC_SALT must be set in .env}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_REQUIRE_TLS=${SMTP_REQUIRE_TLS:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@example.com}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      # 备份：容器内调度（见 server/backup.js），产物必须落卷，否则随容器重建丢失；
      # 设置 BACKUP_AGE_RECIPIENT（age 公钥）后自动加密为 .dump.age
      - BACKUP_DISABLED=${BACKUP_DISABLED:-false}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - BACKUP_INITIAL_DELAY_MS=${BACKUP_INITIAL_DELAY_MS:-600000}
      - BACKUP_AGE_RECIPIENT=${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # nginx 启动时解析并缓存 upstream IP，必须在 api 可达后再启动 frontend
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3001/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks:
      - manga-studio-network

  # 本地开发用假邮件服务器：所有验证/重置邮件落在 http://localhost:8025 网页里。
  # profiles 门控：生产 `up -d` 不会启动；本地调试显式加 `--profile dev`。
  mailpit:
    image: axllent/mailpit:latest
    container_name: manga-studio-mailpit
    profiles:
      - dev
    ports:
      - "8025:8025"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - manga-studio-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: manga-studio:latest
    container_name: manga-studio-app
    ports:
      - "3005:80"
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *default-logging
    networks:
      - manga-studio-network

volumes:
  pgdata:
  backups:

networks:
  manga-studio-network:
    driver: bridge