<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆角方形 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  
  <!-- 胶片齿孔 - 左侧 -->
  <rect x="16" y="28" width="8" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="16" y="48" width="8" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="16" y="68" width="8" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="16" y="88" width="8" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  
  <!-- 胶片齿孔 - 右侧 -->
  <rect x="104" y="28" width="8" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="104" y="48" width="8" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="104" y="68" width="8" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="104" y="88" width="8" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  
  <!-- 中央播放/胶片区域 -->
  <rect x="32" y="32" width="64" height="64" rx="12" fill="#ffffff" fill-opacity="0.15"/>
  
  <!-- AI 星芒 / 播放按钮 -->
  <polygon points="56,42 56,86 80,64" fill="#ffffff" opacity="0.95"/>
  
  <!-- 装饰星点 -->
  <circle cx="88" cy="44" r="3" fill="#fde047"/>
  <circle cx="92" cy="80" r="2.5" fill="#fde047"/>
  <circle cx="40" cy="78" r="2" fill="#fde047"/>
</svg>
